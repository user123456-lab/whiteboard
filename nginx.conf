worker_processes  1;

events {
    worker_connections  1024;
}

http {
    # 路径解析（Windows nginx 实测）：
    #   error_log/access_log/root/temp 相对启动前缀（start.bat 的 -p tools/nginx）；
    #   include 相对本配置文件所在目录（项目根）。
    # 前端构建产物由 vite 直接输出到 tools/nginx/html（见 vite.config.ts 的 outDir），
    # 全部相对路径，跨机器迁移无需改动。
    error_log  logs/error.log;
    access_log logs/access.log;
    include    tools/nginx/conf/mime.types;

    sendfile        on;
    keepalive_timeout  65;

    # gzip 压缩静态资源
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    server {
        listen       80;
        server_name  localhost;

        # Vite 构建产物目录（vite.config.ts 的 outDir 指向 tools/nginx/html）
        root   html;
        index  index.html;

        # 静态资源强缓存（Vite 构建文件名带 hash，可永久缓存）
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # REST API 反向代理
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 大画布导出等长耗时 API 不截断（默认 60s 不够）
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # WebSocket 反向代理
        location /ws/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 长连接不超时（24小时）
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # SPA fallback：所有其他路径返回 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
